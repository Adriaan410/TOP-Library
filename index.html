<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-Library</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="heading">
                <h1>TOP-Library</h1>
            </div>

            <button command="show-modal" commandfor="add_book_dialog">Add Book</button>
            <dialog id="add_book_dialog">
                
                <form method="dialog" id="add_book_form">
                <p>Add a New Book</p>
                <label for="book_author">Author:</label>
                <input type="text" id="book_author" name="author" placeholder="Author">

                <label for="book_title">Title:</label>
                <input type="text" id="book_title" name="book_title" placeholder="Book Title">

                <label for="book_pages">Author:</label>
                <input type="text" inputmode="numeric" id="book_pages" name="book_pages" placeholder="Number of Pages">

                <label for="is_read">Read</label>
                <input type="checkbox" name="is_read" id="is_read">

                <button type="submit" class="submit_btn">Submit Book</button>
            </form>
                <button commandfor="add_book_dialog"  command="close">Close</button>
            </dialog>

</html>
